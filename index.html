<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say It Right: Winter Break Expressions</title>
<style>
:root{
  --paper:#F4F7FA;
  --card:#FFFFFF;
  --navy:#1B3A5C;
  --navy-deep:#12283E;
  --teal:#17868A;
  --teal-dark:#0E5F63;
  --teal-tint:#E4F2F2;
  --amber:#C07A12;
  --amber-bright:#E8A33D;
  --amber-tint:#FDF3E0;
  --line:#D3DEE8;
  --grey:#5A6772;
  --good:#1F8A5B;
  --warn:#C0451A;
  --display:"Segoe UI Black","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:Calibri,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --num:"Consolas","SF Mono","Courier New",monospace;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--body);background:var(--paper);color:var(--navy);
  font-size:17px;line-height:1.45;overflow-x:hidden;
}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;background:none;color:inherit;min-height:var(--tap)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:900;line-height:1.1}
.hide{display:none !important}

/* ===== frame ===== */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;flex:0 0 auto}
.bar .mode{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.72rem,1.6vw,.95rem);color:var(--amber-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .count{font-family:var(--num);font-size:clamp(.8rem,1.7vw,1rem)}
.bar button{color:#fff;border:1px solid #40668C;border-radius:9px;padding:7px 12px;font-size:.82rem;font-weight:700}
.bar .grp{display:flex;gap:6px;align-items:center}
main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:16px 16px 8px;max-width:1300px;width:100%;margin:0 auto}
.foot{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:9px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .tip{color:var(--grey);font-size:.88rem;flex:1 1 220px;min-width:0}
.foot .grp{display:flex;gap:8px;flex:0 0 auto}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 18px;font-weight:800;font-family:var(--display);letter-spacing:.03em;text-transform:uppercase;font-size:.85rem}
.btn-main{background:var(--navy);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-amber{background:var(--amber-bright);color:#2A1B06}
.btn-line{border:2px solid var(--line);color:var(--navy);background:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* ===== home ===== */
.hero{text-align:center;padding:6px 0 18px}
.hero .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:.74rem;color:var(--amber)}
.hero h1{font-size:clamp(1.8rem,6vw,3.3rem);text-transform:uppercase;margin:8px 0 6px}
.hero p{margin:0;color:var(--grey);font-size:clamp(.95rem,2vw,1.1rem)}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mcard{text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px rgba(20,49,79,.06);transition:transform .12s,box-shadow .12s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,49,79,.12)}
.mcard .step{font-family:var(--num);font-size:.8rem;color:var(--amber);font-weight:700;letter-spacing:.08em}
.mcard .t{font-family:var(--display);font-size:1.12rem}
.mcard .d{color:var(--grey);font-size:.92rem}
.mcard .m{font-size:.8rem;color:var(--teal-dark);font-weight:700;margin-top:4px}

/* ===== stage card ===== */
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,30px);box-shadow:0 2px 10px rgba(20,49,79,.07)}
.kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.7rem,1.5vw,.85rem);color:var(--teal);margin-bottom:10px}

/* stress dots signature */
.beat{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vw,16px);margin:0 0 6px}
.syl{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:clamp(7px,1.1vw,12px);height:clamp(7px,1.1vw,12px);border-radius:50%;background:#C8D6E2}
.dot.s1{background:var(--teal);transform:scale(1.35)}
.dot.s2{background:var(--amber-bright);transform:scale(2);box-shadow:0 0 0 3px var(--amber-tint)}
.syl .tx{font-family:var(--display);font-size:clamp(1.5rem,5.6vw,3.6rem);color:var(--navy);line-height:1}
.syl.s2 .tx{color:var(--amber)}
.syl.weak .tx{color:#7C8A97;font-family:var(--body);font-weight:600}
.meaning{text-align:center;font-size:clamp(1rem,2.4vw,1.5rem);color:var(--teal-dark);font-weight:700;margin:10px 0 0}

/* dialogue */
.dlg{display:grid;gap:10px;margin:6px 0 0}
.line{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:clamp(11px,2vw,18px);border-left:6px solid var(--teal)}
.line.b{border-left-color:var(--amber-bright);background:var(--amber-tint)}
.line .who{font-family:var(--display);font-size:clamp(1rem,2.4vw,1.5rem);color:var(--teal);flex:0 0 auto}
.line.b .who{color:var(--amber)}
.line .say{font-size:clamp(1.05rem,2.8vw,1.85rem);line-height:1.35}
.line .say mark{background:transparent;color:var(--navy);font-weight:800;box-shadow:inset 0 -.42em 0 rgba(232,163,61,.42);padding:0 2px}

/* watch out */
.pair{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
.box{border-radius:14px;padding:clamp(12px,2vw,20px);border:2px solid}
.box .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;margin-bottom:7px}
.box .s{font-size:clamp(1.02rem,2.6vw,1.6rem);line-height:1.3}
.no{border-color:#E9BBAC;background:#FDF1ED}.no .lab{color:var(--warn)}.no .s{color:#8A3416;text-decoration:line-through;text-decoration-color:rgba(192,69,26,.5)}
.yes{border-color:#A9DCC3;background:#F0FAF5}.yes .lab{color:var(--good)}.yes .s{color:#125C3D;font-weight:700}
.rule{margin:14px 0 0;background:var(--teal-tint);border-left:6px solid var(--teal);border-radius:12px;padding:clamp(11px,2vw,16px);font-size:clamp(.98rem,2.2vw,1.3rem)}

/* swap it */
.swaps{display:grid;gap:10px;max-width:1000px;margin:0 auto;width:100%}
.swap{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:13px;padding:clamp(11px,2vw,17px)}
.swap .n{font-family:var(--num);font-weight:700;color:var(--teal);font-size:clamp(.95rem,1.8vw,1.2rem);flex:0 0 auto}
.swap .sx{font-size:clamp(1.05rem,2.8vw,1.85rem);line-height:1.3;color:var(--grey)}
.swap .sx b{color:var(--navy);font-weight:800;box-shadow:inset 0 -.42em 0 rgba(232,163,61,.42);padding:0 2px}

/* your turn */
.ask{font-size:clamp(1.2rem,3.6vw,2.4rem);font-weight:700;text-align:center;line-height:1.25;margin:4px 0 18px}
.stem{background:var(--amber-tint);border:2px dashed var(--amber-bright);border-radius:14px;padding:clamp(12px,2.4vw,20px);text-align:center;font-size:clamp(1.05rem,2.8vw,1.9rem);color:var(--navy)}
.stem span{color:var(--amber);font-weight:800}

/* pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;color:var(--grey);min-height:38px}
.pill[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* choices */
.ctx{font-size:clamp(1.05rem,2.9vw,2rem);text-align:center;line-height:1.35;margin:0 0 18px}
.ctx .gap{color:var(--amber);font-weight:800;letter-spacing:.06em}
.picks{display:grid;gap:10px;max-width:900px;margin:0 auto;width:100%}
.pick{border:2px solid var(--line);background:#fff;border-radius:13px;padding:clamp(11px,2vw,17px);font-size:clamp(1rem,2.3vw,1.4rem);text-align:left;display:flex;gap:12px;align-items:center;line-height:1.3}
.pick .k{font-family:var(--num);font-weight:700;color:var(--teal);flex:0 0 auto}
.pick:hover:not(:disabled){border-color:var(--teal)}
.pick.right{border-color:var(--good);background:#F0FAF5}
.pick.wrong{border-color:var(--warn);background:#FDF1ED;opacity:.75}
.pick.alsoright{border-color:var(--amber-bright);background:var(--amber-tint)}
.why{margin:14px auto 0;max-width:900px;background:var(--teal-tint);border-left:6px solid var(--teal);border-radius:12px;padding:13px 16px;font-size:clamp(.95rem,2.1vw,1.25rem)}

/* spinner */
.reels{display:grid;gap:12px;max-width:1000px;margin:0 auto;width:100%}
.reel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:clamp(14px,2.6vw,26px);text-align:center;min-height:clamp(90px,17vh,150px);display:flex;flex-direction:column;justify-content:center}
.reel .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;color:var(--teal);margin-bottom:8px}
.reel .val{font-size:clamp(1.15rem,3.6vw,2.5rem);font-weight:700;line-height:1.2}
.reel.spin .val{opacity:.45;filter:blur(1px)}
.reel.phrase{border-color:var(--amber-bright);background:var(--amber-tint)}
.reel.phrase .lab{color:var(--amber)}
.reel.phrase .val{color:var(--navy);font-family:var(--display)}

/* clock */
.clockbox{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 0;flex-wrap:wrap}
.clock{font-family:var(--num);font-size:clamp(1.8rem,6vw,3.4rem);font-weight:700;line-height:1;color:var(--navy)}
.clock.low{color:var(--warn)}
.big-count{font-family:var(--num);font-size:clamp(3.4rem,17vw,9rem);font-weight:700;text-align:center;line-height:1;color:var(--teal)}

/* slang */
.word{font-family:var(--display);font-size:clamp(2rem,10vw,5.5rem);text-align:center;color:var(--navy);line-height:1}
.mean{text-align:center;font-size:clamp(1.05rem,3vw,2rem);color:var(--teal-dark);font-weight:700;margin:14px 0 0}
.eg{text-align:center;font-size:clamp(1rem,2.5vw,1.6rem);color:var(--navy);margin:12px 0 0;font-style:italic}

.small{color:var(--grey);font-size:.9rem;text-align:center;margin-top:12px}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}.reel.spin .val{filter:none;opacity:1}}
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="grp">
      <button id="home-btn">Menu</button>
      <span class="mode" id="mode-name">Say it right</span>
    </div>
    <div class="grp">
      <span class="count" id="counter"></span>
      <button id="full-btn">Full screen</button>
    </div>
  </header>

  <main id="main"></main>

  <footer class="foot">
    <div class="tip" id="tip">Arrow keys move forwards and back. Press Esc for the menu.</div>
    <div class="grp">
      <button class="btn btn-line" id="prev">Back</button>
      <button class="btn btn-main" id="next">Next</button>
    </div>
  </footer>
</div>

/* ==========================================================
   STATE AND HELPERS
   ========================================================== */
var V = { mode:"home", i:0, stage:0, revealed:false, picked:-1,
          spinning:false, frame:"", phrase:"", qTime:0, qId:null,
          qfLeft:60, qfCount:0, qfId:null, qfOrder:[], qfIdx:0, qfPass:1, qfRunning:false };

var $ = function(id){ return document.getElementById(id); };
var main = $("main");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffled(arr){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){ j = Math.floor(Math.random()*(i+1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function stopClocks(){
  if(V.qId){ clearInterval(V.qId); V.qId = null; }
  if(V.qfId){ clearInterval(V.qfId); V.qfId = null; V.qfRunning = false; }
}

/* ==========================================================
   ROUTER
   ========================================================== */
function go(mode){
  stopClocks();
  V.mode = mode; V.i = 0; V.stage = 0; V.revealed = false; V.picked = -1;
  if(mode === "quick"){ V.qfOrder = qfDeck(null); V.qfIdx = 0; V.qfPass = 1; V.qfCount = 0; V.qfLeft = 60; V.qfRunning = false; }
  if(mode === "ask"){ V.frame = ""; V.phrase = ""; }
  render();
  window.scrollTo(0,0);
}
function render(){
  var m = null, i;
  for(i=0;i<MODES.length;i++){ if(MODES[i].id === V.mode) m = MODES[i]; }
  $("mode-name").textContent = m ? m.t : "Say it right";
  $("home-btn").classList.toggle("hide", V.mode === "home");

  if(V.mode === "home") return viewHome();
  if(V.mode === "focus") return viewFocus();
  if(V.mode === "fit") return viewFit();
  if(V.mode === "fix") return viewFix();
  if(V.mode === "ask") return viewAsk();
  if(V.mode === "quick") return viewQuick();
  if(V.mode === "slang") return viewSlang();
}
function setBar(count, tip, showNav, prevOn, nextOn, nextLabel){
  $("counter").textContent = count || "";
  $("tip").textContent = tip || "";
  $("prev").classList.toggle("hide", !showNav);
  $("next").classList.toggle("hide", !showNav);
  $("prev").disabled = !prevOn;
  $("next").disabled = !nextOn;
  $("next").textContent = nextLabel || "Next";
}

   HOME

    '<div class="menu">';
  for(var i=0;i<MODES.length;i++){
    var m = MODES[i];
    h += '<button class="mcard" data-go="' + m.id + '">' +
         '<span class="step">' + m.step + '</span>' +
         '<span class="t">' + m.t + '</span>' +
         '<span class="d">' + m.d + '</span>' +
         '<span class="m">' + m.m + '</span></button>';
  }
  h += '</div><p class="small">Tip: press Full screen, then use the arrow keys. Everything works without the internet.</p>';
  main.innerHTML = h;
  setBar("", "Choose a part. You do not have to do them all at once.", false);
}

/* ==========================================================
   PART 1: PHRASE FOCUS
   ========================================================== */
var STAGES = ["Meet it", "Read it", "Watch out", "Swap it", "Your turn"];

function beatHtml(ph){
  var h = '<div class="beat">', i, s;
  for(i=0;i<ph.syl.length;i++){
    s = ph.syl[i];
    h += '<span class="syl' + (s[1] === 2 ? " s2" : (s[1] === 0 ? " weak" : "")) + '">' +
         '<span class="dot' + (s[1] ? " s" + s[1] : "") + '"></span>' +
         '<span class="tx">' + esc(s[0]) + '</span></span>';
  }
  return h + '</div>';
}

function viewFocus(){
  var ph = PHRASES[V.i], h = "", i;
  h += '<div class="pills">';
  for(i=0;i<STAGES.length;i++){
    h += '<button class="pill" data-stage="' + i + '" aria-current="' + (i === V.stage) + '">' + STAGES[i] + '</button>';
  }
  h += '</div><div class="stage">';

  if(V.stage === 0){
    h += '<div class="kicker">Meet it: the big dot is the strongest beat</div>' +
         beatHtml(ph) +
         '<p class="meaning">' + ph.meaning + '</p>' +
         '<p class="small">Say it as one chunk, not word by word. The strong syllable is longer and louder, the grey ones almost disappear.</p>';
  } else if(V.stage === 1){
    h += '<div class="kicker">Read it: say both parts out loud</div><div class="dlg">';
    for(i=0;i<ph.d.length;i++){
      h += '<div class="line' + (i ? " b" : "") + '"><span class="who">' + ph.d[i][0] + '</span>' +
           '<span class="say">' + ph.d[i][1] + '</span></div>';
    }
    h += '</div><p class="small">Read it twice: once as A, once as B. Then close your eyes and say the B line from memory.</p>';
  } else if(V.stage === 2){
    h += '<div class="kicker">Watch out: the mistake almost everyone makes</div><div class="pair">' +
         '<div class="box no"><div class="lab">Not this</div><div class="s">' + esc(ph.no) + '</div></div>' +
         '<div class="box yes"><div class="lab">Say this</div><div class="s">' + esc(ph.yes) + '</div></div></div>' +
         '<div class="rule">' + ph.rule + '</div>' +
         '<p class="small">Say the green sentence twice, then say it again with your own ending.</p>';
  } else if(V.stage === 3){
    h += '<div class="kicker">Swap it: the phrase stays, the ending changes</div><div class="swaps">';
    for(i=0;i<ph.swap.length;i++){
      h += '<div class="swap"><span class="n">' + (i+1) + '</span><span class="sx">' + ph.swap[i] + '</span></div>';
    }
    h += '</div><p class="small">Say each one out loud. Then add a fifth ending of your own.</p>';
  } else {
    h += '<div class="kicker">Your turn: answer with one full sentence</div>' +
         '<p class="ask">' + esc(ph.ask) + '</p>' +
         '<div class="stem">' + ph.stem + '</div>' +
         '<p class="small">Add one extra detail: where, who with, how long, or why.</p>';
  }
  h += '</div>';
  main.innerHTML = h;

  var last = (V.i === PHRASES.length - 1) && (V.stage === STAGES.length - 1);
  setBar("Phrase " + (V.i+1) + " of " + PHRASES.length,
    V.stage === 0 ? "Say it three times: slowly, then at normal speed, then fast and natural." :
    V.stage === 1 ? "Read the A line, then read the B line." :
    V.stage === 2 ? "Try to spot the mistake before you read the green box." :
    V.stage === 3 ? "The bold part never changes. Everything after it can." :
                    "Say your answer out loud, not just in your head.",
    true, !(V.i === 0 && V.stage === 0), true, last ? "Finish" : "Next");
}
function focusNext(){
  if(V.stage < STAGES.length - 1){ V.stage++; }
  else if(V.i < PHRASES.length - 1){ V.i++; V.stage = 0; }
  else { return go("home"); }
  render();
}
function focusPrev(){
  if(V.stage > 0){ V.stage--; }
  else if(V.i > 0){ V.i--; V.stage = STAGES.length - 1; }
  render();
}

/* ==========================================================
   PART 2: WHICH ONE FITS?
   ========================================================== */
function viewFit(){
  var q = FIT[V.i], h = "", i, cls, letters = ["a","b","c"];
  h += '<div class="stage"><div class="kicker">Which one fits? Read it out loud first</div>' +
       '<p class="ctx">' + q.ctx + '</p><div class="picks">';
  for(i=0;i<q.o.length;i++){
    cls = "pick";
    if(V.revealed){
      if(i === q.a) cls += " right";
      else if(q.also === i) cls += " alsoright";
      else cls += " wrong";
    }
    h += '<button class="' + cls + '" data-pick="' + i + '"' + (V.revealed ? " disabled" : "") + '>' +
         '<span class="k">' + letters[i] + '</span><span>' + esc(q.o[i]) + '</span></button>';
  }
  h += '</div>';
  if(V.revealed){
    h += '<div class="why">' + esc(q.why) + '</div>';
  }
  h += '</div>';
  main.innerHTML = h;
  setBar("Situation " + (V.i+1) + " of " + FIT.length,
    V.revealed ? "Now say the complete sentence out loud." : "Decide why before you tap an answer.",
    true, V.i > 0, true, (V.i === FIT.length - 1 && V.revealed) ? "Finish" : "Next");
}

/* ==========================================================
   PART 3: FIX THE MISTAKE
   ========================================================== */
function viewFix(){
  var q = FIX[V.i], h = "";
  h += '<div class="stage"><div class="kicker">Fix the mistake: one word is wrong or missing</div>' +
       '<div class="pair"><div class="box no"><div class="lab">The sentence</div><div class="s">' + esc(q.w) + '</div></div>';
  if(V.revealed){
    h += '<div class="box yes"><div class="lab">The fix</div><div class="s">' + esc(q.r) + '</div></div>';
  } else {
    h += '<div class="box" style="border-color:var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center">' +
         '<button class="btn btn-amber" id="reveal">Show the fix</button></div>';
  }
  h += '</div>';
  if(V.revealed){
    h += '<div class="rule">' + esc(q.t) + '</div>';
  }
  h += '</div>';
  main.innerHTML = h;
  setBar("Sentence " + (V.i+1) + " of " + FIX.length,
    V.revealed ? "Say the correct sentence out loud, twice." : "Take ten seconds to work it out before you show the fix.",
    true, V.i > 0, true, (V.i === FIX.length - 1 && V.revealed) ? "Finish" : "Next");
}

/* ==========================================================
   PART 4: ASK THE ROOM
   ========================================================== */
function viewAsk(){
  var h = '<div class="stage"><div class="kicker">Spin, then make the question and answer it</div><div class="reels">' +
    '<div class="reel' + (V.spinning ? " spin" : "") + '" id="reel-q"><div class="lab">Talk about</div>' +
    '<div class="val" id="val-q">' + (V.frame ? esc(V.frame) : "Press spin") + '</div></div>' +
    '<div class="reel phrase' + (V.spinning ? " spin" : "") + '" id="reel-p"><div class="lab">Using this phrase</div>' +
    '<div class="val" id="val-p">' + (V.phrase ? esc(V.phrase) : "&nbsp;") + '</div></div></div>';

  if(V.frame && !V.spinning){
    h += '<p class="ask" style="margin-top:18px">Make a question about <b>' + esc(V.frame) +
         '</b> using <b>' + esc(V.phrase) + '</b>, then answer it.</p>';
  }
  h += '<div class="clockbox">' +
       '<button class="btn btn-amber" id="spin">' + (V.frame ? "Spin again" : "Spin") + '</button>' +
       '<button class="btn btn-line" id="think">10 second think</button>' +
       '<span class="clock" id="ask-clock">' + (V.qTime ? "0:" + (V.qTime < 10 ? "0" : "") + V.qTime : "") + '</span></div>';
  h += '<p class="small">Answer with a full sentence, out loud. Then spin again.</p></div>';
  main.innerHTML = h;
  setBar("", "Keep spinning until you have used every phrase at least once.", false);
}
function spin(){
  if(V.spinning) return;
  V.spinning = true; render();
  var ticks = 0;
  var id = setInterval(function(){
    V.frame = TOPICS[Math.floor(Math.random()*TOPICS.length)];
    V.phrase = BASE[Math.floor(Math.random()*BASE.length)];
    $("val-q").textContent = V.frame;
    $("val-p").textContent = V.phrase;
    ticks++;
    if(ticks > 9){ clearInterval(id); V.spinning = false; render(); }
  }, 70);
}
function think(){
  if(V.qId){ clearInterval(V.qId); V.qId = null; }
  V.qTime = 10;
  $("ask-clock").textContent = "0:10";
  V.qId = setInterval(function(){
    V.qTime--;
    var c = $("ask-clock");
    if(c){ c.textContent = "0:" + (V.qTime < 10 ? "0" : "") + V.qTime; c.className = "clock" + (V.qTime <= 3 ? " low" : ""); }
    if(V.qTime <= 0){ clearInterval(V.qId); V.qId = null; }
  }, 1000);
}

/* ==========================================================
   PART 5: QUICK FIRE
   ========================================================== */
function qfDeck(avoid){
  var d = shuffled(BASE), t;
  if(avoid && d[0] === avoid && d.length > 1){ t = d[0]; d[0] = d[1]; d[1] = t; }
  return d;
}
function qfAdvance(){
  if(!V.qfRunning) return;
  V.qfCount++;
  V.qfIdx++;
  if(V.qfIdx >= V.qfOrder.length){
    V.qfOrder = qfDeck(V.qfOrder[V.qfOrder.length - 1]);
    V.qfIdx = 0;
    V.qfPass++;
  }
  render();
}
function viewQuick(){
  var h = '<div class="stage center">';
  if(!V.qfRunning && V.qfLeft === 60 && V.qfCount === 0){
    h += '<div class="kicker">Quick fire</div>' +
         '<p class="ask">One phrase at a time. Say a true sentence, then move on.<br>How many can you do in sixty seconds?</p>' +
         '<p class="small">The phrases come up in a new random order every time, so you cannot learn the sequence.</p>' +
         '<p><button class="btn btn-amber" id="qf-start" style="font-size:1.1rem;padding:16px 30px">Start the clock</button></p>';
  } else if(V.qfLeft > 0){
    h += '<div class="kicker">Say a true sentence with this phrase</div>' +
         '<div class="word" style="font-size:clamp(1.5rem,7vw,4rem);color:var(--navy)">' + esc(V.qfOrder[V.qfIdx]) + '</div>' +
         '<div class="clockbox"><span class="clock' + (V.qfLeft <= 10 ? " low" : "") + '" id="qf-clock">0:' + (V.qfLeft < 10 ? "0" : "") + V.qfLeft + '</span>' +
         '<button class="btn btn-teal" id="qf-got" style="font-size:1.05rem;padding:15px 28px">Done, next phrase</button></div>' +
         '<p class="small">Sentences said so far: <b>' + V.qfCount + '</b>' +
         (V.qfPass > 1 ? ' &nbsp;|&nbsp; All twelve done, so the order has been shuffled again' : '') + '</p>';
  } else {
    h += '<div class="kicker">Time!</div><div class="big-count">' + V.qfCount + '</div>' +
         '<p class="ask" style="margin-top:10px">true sentences in sixty seconds</p>' +
         '<p><button class="btn btn-amber" id="qf-again">Try to beat it</button></p>';
  }
  h += '</div>';
  main.innerHTML = h;
  setBar("", "Do not stop for small errors during the minute. Keep going and fix them afterwards.", false);
}
function qfStart(){
  var lastSeen = (V.qfOrder && V.qfOrder.length) ? V.qfOrder[V.qfIdx] : null;
  V.qfRunning = true; V.qfLeft = 60; V.qfCount = 0; V.qfIdx = 0; V.qfPass = 1;
  V.qfOrder = qfDeck(lastSeen);
  render();
  V.qfId = setInterval(function(){
    V.qfLeft--;
    var c = $("qf-clock");
    if(V.qfLeft <= 0){ clearInterval(V.qfId); V.qfId = null; V.qfRunning = false; render(); return; }
    if(c){ c.textContent = "0:" + (V.qfLeft < 10 ? "0" : "") + V.qfLeft; c.className = "clock" + (V.qfLeft <= 10 ? " low" : ""); }
  }, 1000);
}

function viewSlang(){

    '<div class="word">' + esc(s.w) + '</div>';
  if(V.revealed){
    h += '<p class="mean">' + esc(s.m) + '</p><p class="eg">"' + esc(s.e) + '"</p>' +
         '<p class="small">Now use it in a sentence about your own week.</p>';
  } else {
    h += '<p class="center" style="margin-top:22px"><button class="btn btn-amber" id="reveal" style="font-size:1.05rem;padding:15px 28px">Show the meaning</button></p>';
  }
  h += '</div>';
  main.innerHTML = h;
  setBar("Word " + (V.i+1) + " of " + SLANG.length,
    V.revealed ? "Try one more example of your own." : "Guess first, then show the meaning.",
    true, V.i > 0, true, (V.i === SLANG.length - 1 && V.revealed) ? "Finish" : "Next");
}

/* ==========================================================
   NAVIGATION
   ========================================================== */
function nextStep(){
  if(V.mode === "focus") return focusNext();
  if(V.mode === "fit"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < FIT.length - 1){ V.i++; V.revealed = false; V.picked = -1; return render(); }
    return go("home");
  }
  if(V.mode === "fix"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < FIX.length - 1){ V.i++; V.revealed = false; return render(); }
    return go("home");
  }
  if(V.mode === "slang"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < SLANG.length - 1){ V.i++; V.revealed = false; return render(); }
    return go("home");
  }
}
function prevStep(){
  if(V.mode === "focus") return focusPrev();
  if(V.i > 0){ V.i--; V.revealed = false; V.picked = -1; render(); }
}
$("next").addEventListener("click", nextStep);
$("prev").addEventListener("click", prevStep);
$("home-btn").addEventListener("click", function(){ go("home"); });

$("full-btn").addEventListener("click", function(){
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen();
      this.textContent = "Exit full screen";
    } else if(document.exitFullscreen){
      document.exitFullscreen();
      this.textContent = "Full screen";
    }
  }catch(e){ /* not allowed here */ }
});

main.addEventListener("click", function(e){
  var t;
  t = e.target.closest("[data-go]");      if(t){ return go(t.getAttribute("data-go")); }
  t = e.target.closest("[data-stage]");   if(t){ V.stage = parseInt(t.getAttribute("data-stage"),10); return render(); }
  t = e.target.closest("[data-pick]");    if(t && !V.revealed){ V.picked = parseInt(t.getAttribute("data-pick"),10); V.revealed = true; return render(); }
  t = e.target.closest("#reveal");        if(t){ V.revealed = true; return render(); }
  t = e.target.closest("#spin");          if(t){ return spin(); }
  t = e.target.closest("#think");         if(t){ return think(); }
  t = e.target.closest("#qf-start");      if(t){ return qfStart(); }
  t = e.target.closest("#qf-got");        if(t){ return qfAdvance(); }
  t = e.target.closest("#qf-again");      if(t){ V.qfLeft = 60; V.qfCount = 0; return render(); }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ return go("home"); }
  if(V.mode === "home") return;
  if(e.key === "ArrowRight" || e.key === " " || e.key === "Spacebar"){
    if(e.target && e.target.tagName === "BUTTON" && e.key !== "ArrowRight") return;
    e.preventDefault();
    if(V.mode === "ask") return spin();
    if(V.mode === "quick"){ return qfAdvance(); }
    return nextStep();
  }
  if(e.key === "ArrowLeft"){ e.preventDefault(); return prevStep(); }
});

go("home");
</script>
</body>
</html>
