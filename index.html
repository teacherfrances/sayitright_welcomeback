<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say It Right: Winter Break Expressions</title>
<style>
:root{
  --paper:#F4F7FA;
  --card:#FFFFFF;
  --navy:#1B3A5C;
  --navy-deep:#12283E;
  --teal:#17868A;
  --teal-dark:#0E5F63;
  --teal-tint:#E4F2F2;
  --amber:#C07A12;
  --amber-bright:#E8A33D;
  --amber-tint:#FDF3E0;
  --line:#D3DEE8;
  --grey:#5A6772;
  --good:#1F8A5B;
  --warn:#C0451A;
  --display:"Segoe UI Black","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:Calibri,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --num:"Consolas","SF Mono","Courier New",monospace;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--body);background:var(--paper);color:var(--navy);
  font-size:17px;line-height:1.45;overflow-x:hidden;
}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;background:none;color:inherit;min-height:var(--tap)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:900;line-height:1.1}
.hide{display:none !important}

/* ===== frame ===== */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;flex:0 0 auto}
.bar .mode{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.72rem,1.6vw,.95rem);color:var(--amber-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .count{font-family:var(--num);font-size:clamp(.8rem,1.7vw,1rem)}
.bar button{color:#fff;border:1px solid #40668C;border-radius:9px;padding:7px 12px;font-size:.82rem;font-weight:700}
.bar .grp{display:flex;gap:6px;align-items:center}
main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:16px 16px 8px;max-width:1300px;width:100%;margin:0 auto}
.foot{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:9px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .tip{color:var(--grey);font-size:.88rem;flex:1 1 220px;min-width:0}
.foot .grp{display:flex;gap:8px;flex:0 0 auto}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 18px;font-weight:800;font-family:var(--display);letter-spacing:.03em;text-transform:uppercase;font-size:.85rem}
.btn-main{background:var(--navy);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-amber{background:var(--amber-bright);color:#2A1B06}
.btn-line{border:2px solid var(--line);color:var(--navy);background:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* ===== home ===== */
.hero{text-align:center;padding:6px 0 18px}
.hero .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:.74rem;color:var(--amber)}
.hero h1{font-size:clamp(1.8rem,6vw,3.3rem);text-transform:uppercase;margin:8px 0 6px}
.hero p{margin:0;color:var(--grey);font-size:clamp(.95rem,2vw,1.1rem)}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mcard{text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px rgba(20,49,79,.06);transition:transform .12s,box-shadow .12s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,49,79,.12)}
.mcard .step{font-family:var(--num);font-size:.8rem;color:var(--amber);font-weight:700;letter-spacing:.08em}
.mcard .t{font-family:var(--display);font-size:1.12rem}
.mcard .d{color:var(--grey);font-size:.92rem}
.mcard .m{font-size:.8rem;color:var(--teal-dark);font-weight:700;margin-top:4px}

/* ===== stage card ===== */
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,30px);box-shadow:0 2px 10px rgba(20,49,79,.07)}
.kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.7rem,1.5vw,.85rem);color:var(--teal);margin-bottom:10px}

/* stress dots signature */
.beat{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vw,16px);margin:0 0 6px}
.syl{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:clamp(7px,1.1vw,12px);height:clamp(7px,1.1vw,12px);border-radius:50%;background:#C8D6E2}
.dot.s1{background:var(--teal);transform:scale(1.35)}
.dot.s2{background:var(--amber-bright);transform:scale(2);box-shadow:0 0 0 3px var(--amber-tint)}
.syl .tx{font-family:var(--display);font-size:clamp(1.5rem,5.6vw,3.6rem);color:var(--navy);line-height:1}
.syl.s2 .tx{color:var(--amber)}
.syl.weak .tx{color:#7C8A97;font-family:var(--body);font-weight:600}
.meaning{text-align:center;font-size:clamp(1rem,2.4vw,1.5rem);color:var(--teal-dark);font-weight:700;margin:10px 0 0}

/* dialogue */
.dlg{display:grid;gap:10px;margin:6px 0 0}
.line{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:clamp(11px,2vw,18px);border-left:6px solid var(--teal)}
.line.b{border-left-color:var(--amber-bright);background:var(--amber-tint)}
.line .who{font-family:var(--display);font-size:clamp(1rem,2.4vw,1.5rem);color:var(--teal);flex:0 0 auto}
.line.b .who{color:var(--amber)}
.line .say{font-size:clamp(1.05rem,2.8vw,1.85rem);line-height:1.35}
.line .say mark{background:transparent;color:var(--navy);font-weight:800;box-shadow:inset 0 -.42em 0 rgba(232,163,61,.42);padding:0 2px}

/* watch out */
.pair{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
.box{border-radius:14px;padding:clamp(12px,2vw,20px);border:2px solid}
.box .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;margin-bottom:7px}
.box .s{font-size:clamp(1.02rem,2.6vw,1.6rem);line-height:1.3}
.no{border-color:#E9BBAC;background:#FDF1ED}.no .lab{color:var(--warn)}.no .s{color:#8A3416;text-decoration:line-through;text-decoration-color:rgba(192,69,26,.5)}
.yes{border-color:#A9DCC3;background:#F0FAF5}.yes .lab{color:var(--good)}.yes .s{color:#125C3D;font-weight:700}
.rule{margin:14px 0 0;background:var(--teal-tint);border-left:6px solid var(--teal);border-radius:12px;padding:clamp(11px,2vw,16px);font-size:clamp(.98rem,2.2vw,1.3rem)}

/* swap it */
.swaps{display:grid;gap:10px;max-width:1000px;margin:0 auto;width:100%}
.swap{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:13px;padding:clamp(11px,2vw,17px)}
.swap .n{font-family:var(--num);font-weight:700;color:var(--teal);font-size:clamp(.95rem,1.8vw,1.2rem);flex:0 0 auto}
.swap .sx{font-size:clamp(1.05rem,2.8vw,1.85rem);line-height:1.3;color:var(--grey)}
.swap .sx b{color:var(--navy);font-weight:800;box-shadow:inset 0 -.42em 0 rgba(232,163,61,.42);padding:0 2px}

/* your turn */
.ask{font-size:clamp(1.2rem,3.6vw,2.4rem);font-weight:700;text-align:center;line-height:1.25;margin:4px 0 18px}
.stem{background:var(--amber-tint);border:2px dashed var(--amber-bright);border-radius:14px;padding:clamp(12px,2.4vw,20px);text-align:center;font-size:clamp(1.05rem,2.8vw,1.9rem);color:var(--navy)}
.stem span{color:var(--amber);font-weight:800}

/* pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;color:var(--grey);min-height:38px}
.pill[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* choices */
.ctx{font-size:clamp(1.05rem,2.9vw,2rem);text-align:center;line-height:1.35;margin:0 0 18px}
.ctx .gap{color:var(--amber);font-weight:800;letter-spacing:.06em}
.picks{display:grid;gap:10px;max-width:900px;margin:0 auto;width:100%}
.pick{border:2px solid var(--line);background:#fff;border-radius:13px;padding:clamp(11px,2vw,17px);font-size:clamp(1rem,2.3vw,1.4rem);text-align:left;display:flex;gap:12px;align-items:center;line-height:1.3}
.pick .k{font-family:var(--num);font-weight:700;color:var(--teal);flex:0 0 auto}
.pick:hover:not(:disabled){border-color:var(--teal)}
.pick.right{border-color:var(--good);background:#F0FAF5}
.pick.wrong{border-color:var(--warn);background:#FDF1ED;opacity:.75}
.pick.alsoright{border-color:var(--amber-bright);background:var(--amber-tint)}
.why{margin:14px auto 0;max-width:900px;background:var(--teal-tint);border-left:6px solid var(--teal);border-radius:12px;padding:13px 16px;font-size:clamp(.95rem,2.1vw,1.25rem)}

/* spinner */
.reels{display:grid;gap:12px;max-width:1000px;margin:0 auto;width:100%}
.reel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:clamp(14px,2.6vw,26px);text-align:center;min-height:clamp(90px,17vh,150px);display:flex;flex-direction:column;justify-content:center}
.reel .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;color:var(--teal);margin-bottom:8px}
.reel .val{font-size:clamp(1.15rem,3.6vw,2.5rem);font-weight:700;line-height:1.2}
.reel.spin .val{opacity:.45;filter:blur(1px)}
.reel.phrase{border-color:var(--amber-bright);background:var(--amber-tint)}
.reel.phrase .lab{color:var(--amber)}
.reel .spinner{font-size:.9rem;color:var(--grey);margin-top:8px}
.clock{font-family:var(--num);font-size:clamp(1.2rem,4vw,2.5rem);font-weight:700;color:var(--teal);transition:color .3s}
.clock.low{color:var(--warn)}
.clockbox{text-align:center;margin:18px 0 0;display:grid;gap:12px}
.big-count{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:900;font-family:var(--display);color:var(--amber)}
.big-count + p{text-align:center}

/* focus details */
.focus{display:grid;gap:10px}
.f-stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.4vw,22px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,24px);align-items:start}
@media (max-width:900px){.f-stage{grid-template-columns:1fr}}
.f-col{display:flex;flex-direction:column;gap:12px}
.f-head{font-family:var(--display);font-size:clamp(1rem,2.4vw,1.4rem);font-weight:700;color:var(--navy);display:flex;gap:8px;align-items:center}
.f-head::before{content:"";display:inline-block;width:clamp(4px,1.2vw,7px);height:clamp(4px,1.2vw,7px);background:var(--teal);border-radius:50%}
.f-sub{font-size:clamp(.9rem,2vw,1.05rem);color:var(--grey);line-height:1.4}

/* center utilities */
.center{text-align:center}
.small{font-size:.88rem;color:var(--grey);margin:8px 0 0}
.word{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,6vw,3.2rem);color:var(--navy);margin:0}
.eg{font-style:italic;color:var(--grey);margin:6px 0 0;font-size:clamp(.95rem,2vw,1.1rem)}
.mean{font-size:clamp(1.15rem,2.8vw,1.6rem);color:var(--navy);font-weight:700;margin:6px 0 0}
</style>
</head>
<body>
<div class="app">
<div class="bar">
  <span class="mode" id="mode">Home</span>
  <div class="grp">
    <button class="btn btn-line" id="home-btn">Menu</button>
  </div>
</div>
<main id="main"></main>
<div class="foot">
  <div class="tip" id="tip"></div>
  <div class="grp">
    <button class="btn btn-line" id="prev">Previous</button>
    <button class="btn btn-main" id="next">Next</button>
  </div>
</div>
</div>

<script>
var V = { mode: "home", i: 0, stage: 0, revealed: false, picked: -1, qfRunning: false, qfIdx: 0, qfLeft: 60, qfCount: 0, qfPass: 1, qfOrder: [] };

function $(e){ return document.getElementById(e); }
function esc(t){ return t.replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]}) }

function setBar(m, t, h, p, n, btn){
  $("mode").textContent = m || "";
  $("tip").textContent = t || "";
  $("prev").style.display = (p === false ? "none" : "");
  $("next").style.display = (n === false ? "none" : "");
  if(btn){ $("next").textContent = btn; } else { $("next").textContent = "Next"; }
}

function render(){
  $("next").disabled = false;
  if(V.mode === "home") viewHome();
  else if(V.mode === "focus") viewFocus();
  else if(V.mode === "fit") viewFit();
  else if(V.mode === "fix") viewFix();
  else if(V.mode === "ask") viewAsk();
  else if(V.mode === "quick") viewQuick();
  else if(V.mode === "slang") viewSlang();
}

function go(m){
  V.mode = m; V.i = 0; V.stage = 0; V.revealed = false; V.picked = -1;
  if(m === "quick"){ V.qfLeft = 60; V.qfCount = 0; V.qfIdx = 0; V.qfPass = 1; }
  render();
}

/* ==========================================================
   CONTENT DATA
   ========================================================== */
var FOCUS = [
  {
    w: "Just on, mate",
    s: 1,
    m: "I'm just arriving / I just got here",
    e: "She was just on when I texted her yesterday.",
    dlg: [
      {w: "A", s: "Hi! Where are you?"},
      {w: "B", s: "Just on, mate. I'm two minutes away."}
    ]
  },
  {
    w: "She'll be right",
    s: 1,
    m: "Everything will be okay / Don't worry",
    e: "Don't stress about the test — she'll be right!",
    dlg: [
      {w: "A", s: "I'm worried about the project deadline."},
      {w: "B", s: "She'll be right! We've still got a week."}
    ]
  },
  {
    w: "Keep your hair on",
    s: 3,
    m: "Calm down / Don't get angry",
    e: "Keep your hair on! I was only joking.",
    dlg: [
      {w: "A", s: "You're late AGAIN!"},
      {w: "B", s: "Keep your hair on! The traffic was bad."}
    ]
  },
  {
    w: "Good onya",
    s: 2,
    m: "Well done / Good job",
    e: "Good onya for finishing the assignment early!",
    dlg: [
      {w: "A", s: "I got 95% on my English test!"},
      {w: "B", s: "Good onya! You studied hard."}
    ]
  }
];

var FIT = [
  {w: "Just on, mate", m: "I'm just arriving / I just got here", a: ["I've arrived", "I will arrive later", "I'm already here"]},
  {w: "She'll be right", m: "Everything will be okay", a: ["Something is wrong", "Don't worry about it", "She is correct"]},
  {w: "Keep your hair on", m: "Calm down", a: ["Cut your hair short", "Relax and be patient", "Wear a hat"]},
  {w: "Good onya", m: "Well done", a: ["Look at you", "You did great", "That's your turn"]}
];

var FIX = [
  {w: "Just on, mate", w2: "I'll just be on", c: 0},
  {w: "She'll be right", w2: "She is right", c: 1},
  {w: "Keep your hair on", w2: "Keep your hat on", c: 0},
  {w: "Good onya", w2: "Good on you", c: 1}
];

var SLANG = [
  {w: "Ta", m: "Thank you", e: "Ta for helping me move house!"},
  {w: "No worries", m: "No problem / You're welcome", e: "Can I borrow your pen? No worries, mate."},
  {w: "Heaps", m: "A lot", e: "That's heaps of homework for one night."},
  {w: "Reckon", m: "Think / Believe", e: "Do you reckon we'll have a test on this?"},
  {w: "Fair dinkum", m: "Genuine / Honest / Truthful", e: "He's fair dinkum about wanting to leave Sydney."},
  {w: "Arvo", m: "Afternoon", e: "See you this arvo!"},
  {w: "Servo", m: "Service station / Petrol station", e: "I'm just popping to the servo for a drink."},
  {w: "Esky", m: "Cooler box", e: "Let's pack the esky for the picnic."},
  {w: "Smoko", m: "Work / study break", e: "It's smoko time — let's grab a coffee."},
  {w: "Drongo", m: "A silly / foolish person", e: "Don't be a drongo — wear your seatbelt!"},
  {w: "Nailed it", m: "Did it perfectly", e: "That pronunciation was perfect — you nailed it!"},
  {w: "Suss out", m: "Find out / Discover", e: "I'll suss out what time the party starts."}
];

/* ==========================================================
   HOME SCREEN
   ========================================================== */
function viewHome(){
  var h = '<div class="hero">' +
           '<div class="eyebrow">Winter Break Practice</div>' +
           '<h1>Say It Right</h1>' +
           '<p>Build your confidence with everyday expressions</p>' +
           '</div>' +
           '<div class="menu">';
  
  h += '<div class="mcard" data-go="focus"><div class="step">Learn</div><div class="t">Focus on four</div><div class="d">Pronunciation, stress, meaning, and dialogue for each key phrase</div></div>';
  h += '<div class="mcard" data-go="fit"><div class="step">Check</div><div class="t">Fit the meaning</div><div class="d">Choose the correct meaning for each expression</div></div>';
  h += '<div class="mcard" data-go="fix"><div class="step">Compare</div><div class="t">Fix the sentence</div><div class="d">Pick the correct way to say it</div></div>';
  h += '<div class="mcard" data-go="ask"><div class="step">Practise</div><div class="t">Build a sentence</div><div class="d">Create your own sentences using the key phrases</div></div>';
  h += '<div class="mcard" data-go="quick"><div class="step">Challenge</div><div class="t">Quick fire</div><div class="d">Say a true sentence with each phrase in one minute</div></div>';
  h += '<div class="mcard" data-go="slang"><div class="step">Explore</div><div class="t">Aussie slang</div><div class="d">Learn more Australian English words and phrases</div></div>';
  
  h += '</div>';
  var main = $("main");
  main.innerHTML = h;
  setBar("Home", "", false);
}

/* ==========================================================
   MODE: FOCUS
   ========================================================== */
function viewFocus(){
  var f = FOCUS[V.i], h = '<div class="stage">' +
    '<div class="kicker">Learn the phrase</div>' +
    '<div class="beat">';
  
  for(var i = 0; i < f.w.split(" ").length; i++){
    var syl = f.w.split(" ")[i];
    var cls = i === f.s ? "s2" : (f.s > 0 && i > f.s ? "weak" : "");
    h += '<div class="syl ' + cls + '"><div class="dot' + (cls ? " " + cls : "") + '"></div><div class="tx">' + esc(syl) + '</div></div>';
  }
  h += '</div><div class="meaning">' + esc(f.m) + '</div>' +
       '<div class="dlg">';
  for(var i = 0; i < f.dlg.length; i++){
    var d = f.dlg[i];
    h += '<div class="line' + (d.w === "B" ? " b" : "") + '"><div class="who">' + esc(d.w) + '</div><div class="say">' + esc(d.s) + '</div></div>';
  }
  h += '</div></div>';
  $("main").innerHTML = h;
  setBar("Focus", "Listen to the pronunciation and stress. Read the dialogue aloud.", true, V.i > 0, true);
}

function focusNext(){
  if(V.i < FOCUS.length - 1){ V.i++; return render(); }
  return go("home");
}
function focusPrev(){
  if(V.i > 0){ V.i--; render(); }
}

/* ==========================================================
   MODE: FIT THE MEANING
   ========================================================== */
function viewFit(){
  var f = FIT[V.i], h = '<div class="stage">' +
    '<div class="kicker">What does this mean?</div>' +
    '<div class="word">' + esc(f.w) + '</div>';
  
  if(V.revealed){
    h += '<p class="mean">' + esc(f.m) + '</p>';
  } else {
    h += '<div class="picks">';
    for(var i = 0; i < f.a.length; i++){
      h += '<button class="pick" data-pick="' + i + '"><span class="k">' + (i+1) + '</span> ' + esc(f.a[i]) + '</button>';
    }
    h += '</div>';
  }
  h += '</div>';
  $("main").innerHTML = h;
  setBar("Check (" + (V.i+1) + " of " + FIT.length + ")", V.revealed ? "Read the meaning carefully." : "Choose which meaning is correct.", true, V.i > 0, true);
}

/* ==========================================================
   MODE: FIX THE SENTENCE
   ========================================================== */
function viewFix(){
  var f = FIX[V.i], h = '<div class="stage">' +
    '<div class="kicker">Which way is correct?</div>' +
    '<div class="pair">' +
      '<div class="box no"><div class="lab">Not quite</div><div class="s">' + esc(f.w2) + '</div></div>' +
      '<div class="box yes"><div class="lab">This is right</div><div class="s">' + esc(f.w) + '</div></div>' +
    '</div>';
  if(V.revealed){
    h += '<div class="rule">' + (f.c === 0 ? "Use the exact words: <b>" + esc(f.w) + "</b>" : "You can say <b>" + esc(f.w) + "</b> or <b>" + esc(f.w2) + "</b>") + '</div>';
  }
  h += '</div>';
  $("main").innerHTML = h;
  setBar("Compare (" + (V.i+1) + " of " + FIX.length + ")", V.revealed ? "Remember this way of saying it." : "Press Next to see the comparison.", true, V.i > 0, true);
}

/* ==========================================================
   MODE: BUILD A SENTENCE
   ========================================================== */
function viewAsk(){
  var ph = FOCUS[V.i].w;
  var h = '<div class="stage center">' +
    '<div class="kicker">Build your sentence</div>' +
    '<div class="ask">Say a true sentence using <span style="color:var(--amber)">"' + esc(ph) + '"</span></div>' +
    '<div class="stem">Your sentence: <span>___________</span></div>' +
    '<p class="small">Speak out loud to yourself. There\'s no one right answer — just make sure it\'s true for you.</p>' +
    '</div>';
  $("main").innerHTML = h;
  setBar("Practise", "Create your own examples to help you remember.", false);
  $("next").disabled = true;
}

/* ==========================================================
   MODE: QUICK FIRE
   ========================================================== */
function viewQuick(){
  var h = '<div class="stage center">';
  if(!V.qfRunning && V.qfLeft === 60 && V.qfCount === 0){
    h += '<div class="kicker">Sentence speedrun</div>' +
         '<p class="ask">Say a true sentence with each phrase<br>How many can you do in sixty seconds?</p>' +
         '<p><button class="btn btn-amber" id="qf-start" style="font-size:1.1rem;padding:16px 30px">Start timer</button></p>';
  } else if(V.qfLeft > 0){
    h += '<div class="kicker">Say a true sentence with this phrase</div>' +
         '<div class="word" style="font-size:clamp(1.5rem,7vw,4rem);color:var(--navy)">' + esc(V.qfOrder[V.qfIdx]) + '</div>' +
         '<div class="clockbox"><span class="clock' + (V.qfLeft <= 10 ? " low" : "") + '" id="qf-clock">0:' + (V.qfLeft < 10 ? "0" : "") + V.qfLeft + '</span>' +
         '<button class="btn btn-teal" id="qf-got" style="font-size:1.05rem;padding:15px 28px">Done, next phrase</button></div>' +
         '<p class="small">Sentences said so far: <b>' + V.qfCount + '</b>' +
         (V.qfPass > 1 ? ' &nbsp;|&nbsp; All phrases shuffled' : '') + '</p>';
  } else {
    h += '<div class="kicker">Time\'s up!</div><div class="big-count">' + V.qfCount + '</div>' +
         '<p class="ask" style="margin-top:10px">sentences in sixty seconds</p>' +
         '<p><button class="btn btn-amber" id="qf-again">Try again</button></p>';
  }
  h += '</div>';
  $("main").innerHTML = h;
  setBar("Challenge", "", false);
}

function qfDeck(avoid){
  var d = FOCUS.map(function(f){ return f.w; });
  if(avoid && d[0] === avoid && d.length > 1){ t = d[0]; d[0] = d[1]; d[1] = t; }
  return d;
}

function qfAdvance(){
  if(!V.qfRunning) return;
  V.qfCount++;
  V.qfIdx++;
  if(V.qfIdx >= V.qfOrder.length){
    V.qfOrder = qfDeck(V.qfOrder[V.qfOrder.length - 1]);
    V.qfIdx = 0;
    V.qfPass++;
  }
  render();
}

function qfStart(){
  var lastSeen = (V.qfOrder && V.qfOrder.length) ? V.qfOrder[V.qfIdx] : null;
  V.qfRunning = true; V.qfLeft = 60; V.qfCount = 0; V.qfIdx = 0; V.qfPass = 1;
  V.qfOrder = qfDeck(lastSeen);
  render();
  V.qfId = setInterval(function(){
    V.qfLeft--;
    var c = $("qf-clock");
    if(V.qfLeft <= 0){ clearInterval(V.qfId); V.qfId = null; V.qfRunning = false; render(); return; }
    if(c){ c.textContent = "0:" + (V.qfLeft < 10 ? "0" : "") + V.qfLeft; c.className = "clock" + (V.qfLeft <= 10 ? " low" : ""); }
  }, 1000);
}

/* ==========================================================
   MODE: SLANG FLASH
   ========================================================== */
function viewSlang(){
  var s = SLANG[V.i], h = '<div class="stage">' +
    '<div class="kicker">What does this word mean?</div>' +
    '<div class="word">' + esc(s.w) + '</div>';
  if(V.revealed){
    h += '<p class="mean">' + esc(s.m) + '</p><p class="eg">"' + esc(s.e) + '"</p>' +
         '<p class="small">Try to use this word in a sentence about your own week.</p>';
  } else {
    h += '<p class="center" style="margin-top:22px"><button class="btn btn-amber" id="reveal" style="font-size:1.05rem;padding:15px 28px">Show the meaning</button></p>';
  }
  h += '</div>';
  $("main").innerHTML = h;
  setBar("Explore (" + (V.i+1) + " of " + SLANG.length + ")",
    V.revealed ? "Practice using the word in your own example." : "Try to guess the meaning first.",
    true, V.i > 0, true, (V.i === SLANG.length - 1 && V.revealed) ? "Back to menu" : "Next");
}

/* ==========================================================
   NAVIGATION
   ========================================================== */
function nextStep(){
  if(V.mode === "focus") return focusNext();
  if(V.mode === "fit"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < FIT.length - 1){ V.i++; V.revealed = false; V.picked = -1; return render(); }
    return go("home");
  }
  if(V.mode === "fix"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < FIX.length - 1){ V.i++; V.revealed = false; return render(); }
    return go("home");
  }
  if(V.mode === "slang"){
    if(!V.revealed){ V.revealed = true; return render(); }
    if(V.i < SLANG.length - 1){ V.i++; V.revealed = false; return render(); }
    return go("home");
  }
}

function prevStep(){
  if(V.mode === "focus") return focusPrev();
  if(V.i > 0){ V.i--; V.revealed = false; V.picked = -1; render(); }
}

$("next").addEventListener("click", nextStep);
$("prev").addEventListener("click", prevStep);
$("home-btn").addEventListener("click", function(){ go("home"); });

$("main").addEventListener("click", function(e){
  var t;
  t = e.target.closest("[data-go]");      if(t){ return go(t.getAttribute("data-go")); }
  t = e.target.closest("[data-stage]");   if(t){ V.stage = parseInt(t.getAttribute("data-stage"),10); return render(); }
  t = e.target.closest("[data-pick]");    if(t && !V.revealed){ V.picked = parseInt(t.getAttribute("data-pick"),10); V.revealed = true; return render(); }
  t = e.target.closest("#reveal");        if(t){ V.revealed = true; return render(); }
  t = e.target.closest("#qf-start");      if(t){ return qfStart(); }
  t = e.target.closest("#qf-got");        if(t){ return qfAdvance(); }
  t = e.target.closest("#qf-again");      if(t){ V.qfLeft = 60; V.qfCount = 0; return render(); }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ return go("home"); }
  if(V.mode === "home") return;
  if(e.key === "ArrowRight" || e.key === " " || e.key === "Spacebar"){
    if(e.target && e.target.tagName === "BUTTON" && e.key !== "ArrowRight") return;
    e.preventDefault();
    return nextStep();
  }
  if(e.key === "ArrowLeft"){ e.preventDefault(); return prevStep(); }
});

go("home");
</script>
</body>
</html>
